source = $XDG_CONFIG_HOME/hypr/colors.conf
$font = JetBrainsMono Nerd Font

general {
  hide_cursor = false
}

background {
  monitor =
  path = $XDG_CONFIG_HOME/background
  blur_passes = 1
  color = $error
  brightness = 0.41272
}

label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  color = $primary
  font_size = 90
  font_family = $font
  position = 0, 130
}

label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = 0, 50
}

input-field {
  monitor =
  size = 300, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $outline
  inner_color = $background_50
  font_color = $text
  fade_on_empty = true
  placeholder_text = Password
  hide_input = false
  check_color = $primary
  fail_color = $error
  fail_text = $ATTEMPTS
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}
